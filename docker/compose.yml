services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musaed}
      POSTGRES_USER: ${POSTGRES_USER:-musaed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musaed} -d ${POSTGRES_DB:-musaed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-musaed}
      DB_USERNAME: ${POSTGRES_USER:-musaed}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - broker

  broker:
    build:
      context: ..
      dockerfile: apps/broker/Dockerfile
    environment:
      PORT: 3002
    ports:
      - "3002:3002"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-development-only}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-change-me-too}
      DATABASE_URL: postgresql://${POSTGRES_USER:-musaed}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-musaed}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
