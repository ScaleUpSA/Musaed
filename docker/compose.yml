services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musaed}
      POSTGRES_USER: ${POSTGRES_USER:-musaed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musaed} -d ${POSTGRES_DB:-musaed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
      APP_NAME: ${APP_NAME:-Musaed}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-musaed}
      DB_USERNAME: ${POSTGRES_USER:-musaed}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-development-only}
      AGENT_URL: http://agent:3001
      AGENT_EVENTS_URL: http://web:8000/internal/runs/events
      AGENT_AUDIT_URL: http://web:8000/internal/runs/events
      AGENT_APPROVALS_URL: http://web:8000/internal/runs/events
      AGENT_ENVELOPE_PRIVATE_KEY: ${AGENT_ENVELOPE_PRIVATE_KEY:?Run docker run --rm -v .:/app -w /app php:8.4-cli php scripts/generate-envelope-keypair.php --write}
      RUN_ENVELOPE_LIFETIME_SECONDS: ${RUN_ENVELOPE_LIFETIME_SECONDS:-300}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    environment:
      PORT: 3001
      AGENT_RUN_ROOT: ${AGENT_RUN_ROOT:-/var/lib/musaed/runs}
      LITELLM_URL: ${LITELLM_URL:-http://litellm:4000}
      AGENT_ENVELOPE_PUBLIC_KEY: ${AGENT_ENVELOPE_PUBLIC_KEY:?Run docker run --rm -v .:/app -w /app php:8.4-cli php scripts/generate-envelope-keypair.php --write}
      AGENT_ENVELOPE_CLOCK_SKEW_SECONDS: ${AGENT_ENVELOPE_CLOCK_SKEW_SECONDS:-30}
    ports:
      - "${AGENT_PORT:-3001}:3001"
    depends_on:
      - broker

  broker:
    build:
      context: ..
      dockerfile: apps/broker/Dockerfile
    environment:
      PORT: 3002
    ports:
      - "${BROKER_PORT:-3002}:3002"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-development-only}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-change-me-too}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-musaed}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/litellm
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
